# LifeOS — file cấu hình MẪU.
# Khi cài, Tiko chép file này thành /workspace/lifeos/config.toml rồi hỏi Khôi để điền thông tin thật.
# File thật nằm trên máy bot, KHÔNG BAO GIỜ đưa lên GitHub. Không ghi mật khẩu vào đây (mật khẩu ở Vault).

[owner]
name = "Khôi"
timezone = "Asia/Ho_Chi_Minh"   # các script luôn dùng UTC+7

# ---------- Người quan trọng (luật 🔴: hỏi trực tiếp, chưa trả lời > 12 giờ) ----------
# name/aliases: chỉ cần một phần tên xuất hiện trong người gửi là khớp (không phân biệt hoa thường).
[[people.vip]]
name = "Quản lý"
aliases = ["quản lý", "sếp"]
group = "congty"

[[people.vip]]
name = "Giảng viên"
aliases = ["thầy", "cô"]
group = "hoctap"

[[people.vip]]
name = "Gia đình"
aliases = ["mẹ", "ba", "bố"]
group = "canhan"

# ---------- Luật ----------
[rules]
urgent_keywords = ["hoãn thi", "nghỉ học", "đổi phòng", "đổi lịch thi", "khẩn", "hoãn", "huỷ", "hủy"]
stale_hours = 14          # file mảng cũ hơn chừng này giờ thì báo "dữ liệu cũ"

[alerts]
quiet_hours = ["23:00", "06:00"]   # không nhắn cảnh báo trong khoảng này

# ---------- Lịch & khung trống (quy tắc R1, R2) ----------
[schedule]
active_from = "07:00"
active_to = "23:00"
travel_minutes = 30
travel_kinds = ["class", "exam", "work_shift"]
focus_default_minutes = 30
reminder_lead_minutes = 5        # nhắc sau khi tan học/tan làm bao nhiêu phút

# Giờ ăn, giờ dậy/ngủ, văn phòng, tập luyện: xem [day], [office], [training] bên dưới.
# Các khung bảo vệ thêm (nếu có) khai báo dạng:
# [[schedule.protected]]
# from = "12:00"
# to = "13:00"
# label = "..."

# ---------- Một ngày của Khôi (dùng để xếp kế hoạch) ----------
[day]
wake_gym = "05:30"            # ngày có gym sáng
wake_normal = "07:00"
first_task_after_wake = 30    # phút từ lúc dậy tới việc đầu tiên (ngày không gym)
wake_before_first_class = 60  # có lớp/thi sớm thì dậy trước giờ đó ít nhất 60 phút
first_task_after_gym = 15     # phút sau buổi gym tới việc đầu tiên
bedtime = "24:00"             # ngủ muộn nhất
bedtime_before_gym = "23:30"  # tối trước hôm gym (ngủ đủ 6 tiếng)
wind_down_minutes = 30        # không xếp việc trong 30 phút trước giờ ngủ
lunch = ["12:00", "13:00"]
dinner = ["18:30", "19:30"]   # ngày có chạy tối: ăn sau buổi chạy 15 phút, 45 phút
dinner_after_run_minutes = 45

# Giới hạn giờ việc 📝 mỗi ngày (không tính lớp học, văn phòng, tập luyện)
[capacity]
office_full = { minutes = 150, blocks = 3 }   # văn phòng ≥ 6 tiếng
office_half = { minutes = 240, blocks = 4 }
no_office   = { minutes = 300, blocks = 5 }
sunday      = { minutes = 180, blocks = 3 }

# Thang ưu tiên (1 cao nhất): 1 thi/lịch học · 2 việc học hạn ≤48h · 3 văn phòng + việc công ty có hạn
# · 4 ôn tập, việc học còn xa · 5 gym/chạy · 6 đi chơi, bạn bè
[priority]
academic_urgent_hours = 48

# ---------- Văn phòng (đề xuất mỗi Chủ nhật, Khôi duyệt) ----------
[office]
days = [1, 2, 3, 4, 5, 6]     # 1 = Thứ 2 … 6 = Thứ 7
hours = ["09:00", "18:00"]
min_hours = 4                 # khung trống ít hơn thì đề xuất nghỉ văn phòng ngày đó
company_calendar_title = "Office"   # ghi bằng Working location = Office trên lịch công ty

# ---------- Tập luyện (bot tạo lịch mỗi Chủ nhật trên lịch "LifeOS") ----------
[training]
gym_time = ["06:00", "08:00"]
gym = { 1 = "Gym: PUSH", 3 = "Gym: PULL", 5 = "Gym: LEGS" }
run = { 2 = "Chạy: INTERVAL", 4 = "Chạy: EASY", 6 = "Chạy: LONG RUN" }
run_minutes = { 2 = 75, 4 = 60, 6 = 90 }
run_start_office_day = "18:15"
run_start_free_day = "17:00"
run_latest_end = "21:00"
group_run_keyword = ""   # tên/địa điểm buổi chạy nhóm (Tiko hỏi Khôi). Có sự kiện chứa chữ này (đã nhận lời) trong ngày chạy → thay buổi chạy đó

# ---------- Ôn thi ----------
[exam_prep]
test = { sessions = 3, minutes = 90, days_before = 5, keywords = ["kiểm tra", "giữa kỳ", "giữa kì", "midterm"] }
final = { sessions = 6, minutes = 90, days_before = 14 }
urgent_last_sessions = 2      # 2 buổi cuối lên bậc 2

# ---------- Nhịp chạy (Tiko dùng để biết bot nào trễ) ----------
[health]
grace_minutes = 45
source_red_hours = 36

[health.expected]   # giờ các lần chạy ĐẦY ĐỦ của từng bot
zalo = ["04:40", "20:10"]
hoctap = ["05:00", "20:30"]
congty = ["05:00", "20:30"]
canhan = ["05:00", "20:30"]
lifeos = ["05:30", "21:00"]

[scan]
full = ["05:00", "20:30"]
light = ["11:30", "14:30", "17:30"]

# ---------- Lưu trữ (ngày & tuần 90 ngày, Zalo thô 7 ngày, tháng giữ lâu dài) ----------
[retention]
daily_days = 90
weekly_days = 90
zalo_raw_days = 7
journal_days = 90          # nhật ký chuyện đã nói (sổ nhớ). Sổ nhớ và kho giữ lâu dài.

# ---------- Sổ nhớ (SPEC §5c) ----------
[brain]
core_limits = { ve_khoi = 8, muc_tieu = 5, nguoi_quen = 10, cach_lam_viec = 7, dang_do = 6, tranh = 4 }   # ~40 dòng
stale_days = 180           # điều lâu hơn chừng này không ai nhắc → báo cáo tháng hỏi "còn đúng không?"
stale_per_month = 5
proposals_per_night = 3    # đề xuất của bot quét nguồn mỗi tối
proposal_max_asks = 2      # hỏi lần đầu + hỏi lại 1 lần, vẫn im lặng thì bỏ
report_max_new = 5         # dòng 🧠 hiện tối đa chừng này điều mới, còn lại xem Page
page_recent_days = 7
page_kho_items = 10

[dashboard]
chromium = ""     # để trống = tự tìm. Tiko điền đường dẫn nếu không tự tìm được.
page_title = "LifeOS · Hiệu suất"

# ---------- Nguồn từng mảng (Tiko hỏi Khôi để điền) ----------
[sources.hoctap]
gmail_account = "Mail trường"
calendar = "trường"
lms_course_ids = []          # ví dụ [123456, 234567]
mybk_pages = ["dkmh", "lich-thi", "thoi-khoa-bieu", "bang-diem", "hoc-phi", "hoat-dong"]
aao_url = ""

[sources.congty]
mail = "trình duyệt (SSO công ty)"
calendar_days_ahead = 14

[sources.canhan]
gmail_accounts = ["Mail cá nhân", "Mail cá nhân chính"]
calendars = ["cá nhân", "cá nhân chính"]
reminders_list = "To-do list"

[zalo]
tags = { "Công việc" = "congty", "Trường học" = "hoctap", "Bạn bè" = "canhan", "Gia đình" = "canhan" }
restore_unread = true       # đọc xong đánh dấu lại "chưa đọc" nếu trước đó đang chưa đọc
max_login_attempts = 1
